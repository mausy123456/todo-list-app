<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <h1>My To-Do List</h1>

      <form id="todo-form">
        <input
          id="todo-input"
          type="text"
          placeholder="Add a new task..."
          aria-label="New task"
        />
        <button type="submit">Add</button>
      </form>

      <div class="actions">
        <button id="clear-completed" class="secondary" type="button">
          Clear Completed
        </button>
      </div>

      <ul id="todo-list" aria-live="polite"></ul>
    </div>

    <script src="script.js"></script>
  </body>
</html>
