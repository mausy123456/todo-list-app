<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modern To-Do List</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <div class="app-card">
        <header class="topbar">
          <div>
            <p class="eyebrow">TASK MANAGER</p>
            <h1>My Daily Plan</h1>
          </div>

          <button id="theme-toggle" class="icon-button" type="button" aria-label="Toggle theme">
            🌙
          </button>
        </header>

        <div class="summary">
          <div>
            <span class="summary-label">Today</span>
            <strong id="task-count">0 tasks</strong>
          </div>
          <div>
            <span class="summary-label">Done</span>
            <strong id="done-count">0</strong>
          </div>
        </div>

        <form id="todo-form" class="todo-form">
          <input
            id="todo-input"
            type="text"
            placeholder="Add a new task..."
            aria-label="New task"
            maxlength="120"
          />
          <button type="submit" class="primary-btn">Add</button>
        </form>

        <div class="filter-bar" aria-label="Filter tasks">
          <button class="filter-btn active" data-filter="all" type="button">All</button>
          <button class="filter-btn" data-filter="active" type="button">Active</button>
          <button class="filter-btn" data-filter="completed" type="button">Completed</button>
        </div>

        <ul id="todo-list" class="todo-list" aria-live="polite"></ul>

        <div class="footer-actions">
          <button id="clear-completed" class="secondary-btn" type="button">
            Clear Completed
          </button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
